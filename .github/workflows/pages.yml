name: Build & deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: site/package-lock.json }
      - name: Build website
        working-directory: site
        env:
          BASE_PATH: /qasrelhaliwayt/
          SITE_URL: https://sebahi696.github.io
        run: npm ci && npm run build
      - name: Add app + staff panel
        run: |
          mkdir -p site/dist/app site/dist/staff
          cp -r app/. site/dist/app/
          cp staff/index.html site/dist/staff/
          touch site/dist/.nojekyll
      - uses: actions/configure-pages@v5
        with: { enablement: true }
      - uses: actions/upload-pages-artifact@v3
        with: { path: site/dist }
      - id: deployment
        uses: actions/deploy-pages@v4
