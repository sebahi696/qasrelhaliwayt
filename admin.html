<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)} img{max-width:100%} [hidden]{display:none!important}</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap">
<style>
/* Layout: indigo rail + ivory workspace. Dense, scannable, built for a call-centre screen and installable on a phone. */
:root{
  --gold:#B8822E; --gold-deep:#8F6118; --gold-soft:#F3E6CF;
  --indigo:#1F2A6B; --indigo-deep:#141B49; --indigo-soft:#E6E9F6; --turq:#2E9FD1;
  --ivory:#F7F3EB; --paper:#FFFFFF; --sand:#E9DFCC; --line:#E3D9C5;
  --ink:#1C1812; --muted:#6B6257; --ok:#2E7D4F; --ok-bg:#E4F2EA; --warn:#B9731C; --warn-bg:#FFF3D6; --danger:#B3261E; --danger-bg:#FBE9E7;
  --display:'Marcellus','Georgia',serif; --body:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --ar:'Tajawal','Segoe UI',Tahoma,sans-serif;
}
*{box-sizing:border-box} html,body{height:100%} body{margin:0;background:var(--ivory);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--indigo-deep)}
body.ar{font-family:var(--ar)} body.ar .disp{font-family:var(--ar);font-weight:800}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer} input,select,textarea{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--turq);outline-offset:2px}
.disp{font-family:var(--display);font-weight:400;text-wrap:balance} .money{font-variant-numeric:tabular-nums}
.app{display:flex;height:100%}
.rail{width:232px;flex:none;background:var(--indigo-deep);color:#D9D4E6;display:flex;flex-direction:column;padding-top:max(16px,env(safe-area-inset-top,0px));padding-left:max(12px,env(safe-area-inset-left,0px));padding-bottom:env(safe-area-inset-bottom,0px);padding-right:12px}
.rail .brand{display:flex;align-items:center;gap:10px;padding:6px 8px 18px} .rail .brand img{width:30px} .rail .brand b{font-family:var(--display);font-weight:400;color:#fff;font-size:15px;display:block;line-height:1.1} .rail .brand small{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.rail nav{display:flex;flex-direction:column;gap:2px;flex:1}
.rail nav button{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;font-weight:700;color:#B9B3CC;text-align:start;transition:all .15s} .rail nav button:hover{background:rgba(255,255,255,.06)} .rail nav button.on{background:rgba(255,255,255,.12);color:#fff}
.rail nav button .n{margin-inline-start:auto;background:var(--gold);color:#fff;font-size:11px;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;padding:0 6px}
.rail .foot{padding:12px 8px;font-size:12px;color:#8E88A6;display:flex;flex-direction:column;gap:8px} .rail .foot button{color:#D9D4E6;font-weight:700;text-align:start}
.rail .who{display:flex;align-items:center;gap:10px;padding:10px 8px;border-top:1px solid rgba(255,255,255,.1)} .rail .who .av{width:32px;height:32px;border-radius:10px;background:var(--gold);color:#fff;display:grid;place-items:center;font-weight:800}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.head{display:flex;align-items:center;gap:12px;padding-block:14px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--paper)}
.head h1{font-size:22px;margin:0} .head .sub{color:var(--muted);font-size:13px} .head .sp{flex:1}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--ok)} .live i{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:blink 1.4s infinite} @keyframes blink{50%{opacity:.3}}
.work{flex:1;overflow:auto;padding-block:18px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:38px;padding:0 14px;border-radius:11px;font-weight:700;font-size:13px;transition:transform .12s,filter .15s;white-space:nowrap}
.btn:active{transform:scale(.97)} .btn.p{background:var(--indigo);color:#fff} .btn.g{background:var(--gold);color:#fff} .btn.o{background:var(--paper);border:1.5px solid var(--line)} .btn.d{background:var(--danger-bg);color:var(--danger)} .btn.ok{background:var(--ok);color:#fff} .btn.sm{height:32px;padding:0 10px;font-size:12px;border-radius:9px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:800;background:var(--sand)}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.warn{background:var(--warn-bg);color:var(--warn)} .chip.bad{background:var(--danger-bg);color:var(--danger)} .chip.ind{background:var(--indigo-soft);color:var(--indigo)} .chip.gold{background:var(--gold-soft);color:var(--gold-deep)}
.pill{font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--sand)}
.pill.received{background:var(--gold-soft);color:var(--gold-deep)} .pill.accepted,.pill.preparing{background:var(--warn-bg);color:var(--warn)} .pill.onTheWay,.pill.ready{background:var(--indigo-soft);color:var(--indigo)} .pill.delivered{background:var(--ok-bg);color:var(--ok)} .pill.cancelled{background:var(--danger-bg);color:var(--danger)}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:800} body.ar .eyebrow{letter-spacing:0}
.toggle{width:40px;height:24px;border-radius:12px;background:var(--sand);position:relative;flex:none;transition:background .2s} .toggle::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)} .toggle.on{background:var(--ok)} .toggle.on::after{transform:translateX(16px)} [dir=rtl] .toggle.on::after{transform:translateX(-16px)}
input.in,select.in,textarea.in{height:36px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);padding:0 10px;min-width:0} input.in:focus,select.in:focus{border-color:var(--indigo);outline:none} input.in.sm{height:30px;width:80px;text-align:end}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.tile{padding:14px 16px} .tile .l{font-size:12px;color:var(--muted);font-weight:700} .tile .v{font-family:var(--display);font-size:28px;line-height:1.1;margin-top:4px} body.ar .tile .v{font-family:var(--ar);font-weight:800} .tile .d{font-size:12px;margin-top:4px;color:var(--ok);font-weight:700} .tile .d.down{color:var(--danger)}
/* board */
.board{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:14px;min-width:980px} .boardwrap{overflow-x:auto;margin:0 -4px;padding:0 4px}
.col{display:flex;flex-direction:column;gap:10px} .col .ch{display:flex;align-items:center;gap:8px;font-weight:800;padding:4px 2px} .col .ch i{width:10px;height:10px;border-radius:3px} .col .ch .n{margin-inline-start:auto;color:var(--muted);font-weight:700;font-size:12px}
.ocard{padding:12px;display:flex;flex-direction:column;gap:8px;animation:in .3s} @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.ocard.late{border-color:var(--danger);box-shadow:0 0 0 3px var(--danger-bg)} .ocard.new{border-color:var(--gold)}
.ocard .t{display:flex;align-items:center;gap:8px} .ocard .t b{font-size:15px} .ocard .t .age{margin-inline-start:auto;font-size:12px;color:var(--muted);font-weight:700} .ocard .t .age.late{color:var(--danger)}
.ocard .c{font-weight:700} .ocard .a{font-size:12px;color:var(--muted);line-height:1.35} .ocard .ln{font-size:12.5px;display:flex;flex-direction:column;gap:2px;padding:8px 0;border-top:1px dashed var(--line);border-bottom:1px dashed var(--line)}
.ocard .tot{display:flex;justify-content:space-between;font-weight:800} .ocard .acts{display:flex;gap:6px;flex-wrap:wrap}
.ocard .tags{display:flex;gap:5px;flex-wrap:wrap}
/* tables */
table{width:100%;border-collapse:collapse;font-size:13px} th{text-align:start;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);font-weight:800} td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle} tr:last-child td{border-bottom:0} .tbl{overflow-x:auto} body.ar th{letter-spacing:0}
td .img{width:40px;height:40px;border-radius:10px;object-fit:cover;background:var(--gold-soft);display:inline-grid;place-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.bc{padding:16px;display:flex;flex-direction:column;gap:10px} .bc .nm{font-size:18px} .bc .kv{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px} .bc .kv span:first-child{color:var(--muted);font-weight:700}
.zones{display:flex;flex-wrap:wrap;gap:5px} .zones span{font-size:11px;background:var(--sand);padding:3px 8px;border-radius:999px;font-weight:700}
.modal-bg{position:fixed;inset:0;background:rgba(20,24,40,.5);z-index:40;display:none;align-items:center;justify-content:center;padding:16px} .modal-bg.on{display:flex}
.modal{background:var(--ivory);border-radius:20px;width:100%;max-width:520px;max-height:90vh;overflow:auto;padding:20px;animation:in .25s}
.f{display:flex;flex-direction:column;gap:4px;margin-bottom:10px} .f label{font-size:12px;font-weight:700;color:var(--muted)} .f .in{width:100%}
.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,20px);background:var(--ink);color:var(--ivory);padding:10px 16px;border-radius:12px;font-weight:700;opacity:0;transition:all .3s;z-index:60;pointer-events:none} .toast.show{opacity:1;transform:translate(-50%,0)}
.bars{display:flex;align-items:flex-end;gap:6px;height:140px;padding-top:10px} .bars div{flex:1;background:var(--indigo);border-radius:6px 6px 2px 2px;position:relative;min-width:0;transition:height .6s cubic-bezier(.2,.8,.2,1)} .bars div.g{background:var(--gold)} .bars div span{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-size:10px;color:var(--muted);font-weight:700;white-space:nowrap}
.hbar{display:flex;align-items:center;gap:10px;font-size:13px;margin-bottom:8px} .hbar .lab{width:150px;flex:none;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .hbar .tr{flex:1;height:10px;background:var(--sand);border-radius:5px;overflow:hidden} .hbar .tr i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-deep));border-radius:5px} .hbar .v{width:60px;text-align:end;font-weight:800}
.menubar{position:fixed;top:0;inset-inline-start:0;z-index:30;display:none;padding:calc(10px + env(safe-area-inset-top,0px)) 10px 10px}
.menubar button{width:38px;height:38px;border-radius:10px;background:var(--indigo-deep);color:#fff;display:grid;place-items:center}
@media (max-width:860px){ .rail{position:fixed;inset:0 auto 0 0;z-index:35;transform:translateX(-100%);transition:transform .25s;box-shadow:0 0 40px rgba(0,0,0,.4)} [dir=rtl] .rail{inset:0 0 0 auto;transform:translateX(100%)} .rail.open{transform:none} .menubar{display:block} .head{padding-inline-start:60px} .work{padding-inline-start:16px;padding-inline-end:16px} .board{min-width:0;grid-template-columns:1fr} .boardwrap{overflow:visible} }
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="menubar"><button id="menuBtn" aria-label="Menu">☰</button></div>

</div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script src="data.js"></script>
<script>
(function(){
const D=window.QASR, $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)], fmt=D.money;
const T={en:{staffPanel:'Staff panel',openApp:'Open customer app',live:'Live',orders:'Live orders',menu:'Menu',branches:'Branches',intl:'International',marketing:'Marketing',customers:'Customers',reports:'Reports',settings:'Settings',colNew:'New',colAccepted:'Accepted · preparing',colOut:'Out for delivery',colDone:'Done',open:'open',today:'today',accept:'Accept',verify:'Verify number',whatsapp:'WhatsApp',cancel:'Cancel',ready:'Ready',out:'Out for delivery',delivered:'Delivered',driverLink:'Driver link',handDhl:'Handed to DHL',unverified:'Unverified',verified:'Verified',cash:'Cash',card:'Card',whish:'Whish',prep:'Prep time',min:'min',late:'late',ordersSub:'Call-centre board · refreshes automatically',menuSub:'Availability, prices and shipping flags · changes go live in the app instantly',branchesSub:'Hours, delivery fees and zones per branch',intlSub:'Countries, DHL rates and shipping rules',marketingSub:'Banners, promo codes and rewards',customersSub:'Phone-verified identities, points and blocks',reportsSub:'Last 7 days · all branches',settingsSub:'Owner settings',item:'Item',category:'Category',price:'Price',available:'Available',ships:'Ships intl',popular:'Popular',photo:'Photo',search:'Search items…',addItem:'Add item',pause:'Pause orders',resume:'Resume',fee:'Delivery fee',minOrder:'Min. order',eta:'ETA',zones:'Zones',importZones:'Import zones (Excel)',edit:'Edit',country:'Country',base:'First kg',perKg:'Extra kg',days:'Days',enabled:'Enabled',carrier:'Carrier',freeOver:'Free shipping over',minIntl:'Min. intl order',code:'Code',value:'Value',uses:'Uses',active:'Active',banner:'Banner',reward:'Reward',points:'Points',name:'Name',phone:'Phone',ordersN:'Orders',spent:'Spent',lastOrder:'Last order',block:'Block',unblock:'Unblock',revenue:'Revenue',avg:'Avg. order',intlShare:'Intl share',topItems:'Top items',byBranch:'Revenue by branch',dailyOrders:'Orders per day',pointsRate:'Points per $1',cashback:'Cashback %',welcome:'Welcome bonus',lbp:'LBP rate',unvLimit:'Unverified order limit',minBuild:'Minimum app build',save:'Save settings',saved:'Saved',pay:'Payment',all:'All',deals:'Deals'},
  ar:{staffPanel:'لوحة الموظفين',openApp:'افتح تطبيق الزبائن',live:'مباشر',orders:'الطلبات المباشرة',menu:'المنيو',branches:'الفروع',intl:'الشحن الدولي',marketing:'التسويق',customers:'الزبائن',reports:'التقارير',settings:'الإعدادات',colNew:'جديد',colAccepted:'مقبول · قيد التحضير',colOut:'بالطريق',colDone:'منتهي',open:'مفتوح',today:'اليوم',accept:'قبول',verify:'توثيق الرقم',whatsapp:'واتساب',cancel:'إلغاء',ready:'جاهز',out:'خرج للتوصيل',delivered:'تم التوصيل',driverLink:'رابط السائق',handDhl:'سُلّم لـ DHL',unverified:'غير موثّق',verified:'موثّق',cash:'نقداً',card:'بطاقة',whish:'Whish',prep:'وقت التحضير',min:'د',late:'متأخر',ordersSub:'لوحة الكول سنتر · تتحدث تلقائياً',menuSub:'التوفر والأسعار وعلامات الشحن · التغييرات تظهر فوراً بالتطبيق',branchesSub:'الدوام ورسوم التوصيل والمناطق لكل فرع',intlSub:'الدول وأسعار DHL وقواعد الشحن',marketingSub:'البانرات وأكواد الخصم والمكافآت',customersSub:'هويات موثّقة بالهاتف، نقاط وحظر',reportsSub:'آخر ٧ أيام · كل الفروع',settingsSub:'إعدادات المالك',item:'الصنف',category:'الفئة',price:'السعر',available:'متوفر',ships:'يُشحن دولياً',popular:'الأكثر طلباً',photo:'صورة',search:'ابحث عن صنف…',addItem:'إضافة صنف',pause:'إيقاف الطلبات',resume:'استئناف',fee:'رسم التوصيل',minOrder:'الحد الأدنى',eta:'الوقت',zones:'المناطق',importZones:'استيراد مناطق (Excel)',edit:'تعديل',country:'الدولة',base:'أول كيلو',perKg:'كل كيلو إضافي',days:'الأيام',enabled:'مفعّل',carrier:'شركة الشحن',freeOver:'شحن مجاني فوق',minIntl:'الحد الأدنى للطلب الدولي',code:'الكود',value:'القيمة',uses:'الاستخدامات',active:'فعّال',banner:'بانر',reward:'مكافأة',points:'نقاط',name:'الاسم',phone:'الهاتف',ordersN:'الطلبات',spent:'الإنفاق',lastOrder:'آخر طلب',block:'حظر',unblock:'إلغاء الحظر',revenue:'الإيرادات',avg:'متوسط الطلب',intlShare:'حصة الدولي',topItems:'الأصناف الأكثر مبيعاً',byBranch:'الإيرادات حسب الفرع',dailyOrders:'الطلبات يومياً',pointsRate:'نقاط لكل $١',cashback:'كاش باك ٪',welcome:'مكافأة الترحيب',lbp:'سعر الليرة',unvLimit:'حد الطلبات غير الموثّقة',minBuild:'أدنى إصدار للتطبيق',save:'حفظ الإعدادات',saved:'تم الحفظ',pay:'الدفع',all:'الكل',deals:'العروض'}};
const S={lang:D.load('qasr_admin_lang','en'),page:'orders',branchFilter:'all',q:''};
const t=k=>T[S.lang][k]??k, L=o=>o?(o[S.lang]||o.en):'';
let toastT; const toast=m=>{const e=$('#toast');e.textContent=m;e.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('show'),1600);};
const pages=[['orders','🧾'],['menu','📋'],['branches','📍'],['intl','✈️'],['marketing','🎁'],['customers','👥'],['reports','📊'],['settings','⚙️']];
const subs={orders:'ordersSub',menu:'menuSub',branches:'branchesSub',intl:'intlSub',marketing:'marketingSub',customers:'customersSub',reports:'reportsSub',settings:'settingsSub'};

$('#langBtn').onclick=()=>{S.lang=S.lang==='en'?'ar':'en';applyLang();render();};

function render(){ renderNav(); $('#title').textContent=t(S.page); $('#subtitle').textContent=t(subs[S.page]); $('#liveTag').style.display=S.page==='orders'?'':'none'; $('#headActions').innerHTML=''; ({orders,menu,branches,intl,marketing,customers,reports,settings})[S.page](); }

const age=o=>Math.round((Date.now()-o.ts)/60000);
const bname=id=>id==='intl'?t('intl'):L(D.liveBranches().find(b=>b.id===id)?.name);
const itemName=id=>L(D.items.find(i=>i.id===id)?.name);

// ---------- Orders board ----------
function orders(){
  const all=D.getOrders().filter(o=>S.branchFilter==='all'||o.branch===S.branchFilter);

function ocard(o){ const a=age(o), late=D.isOpen(o.status)&&a>=30, intl=o.type==='intl'; const c=o.customer;

function actions(o){ const b=(act,lbl,cls='o')=>`<button class="btn sm ${cls}" data-act="${act}" data-id="${o.id}">${lbl}</button>`; const wa=o.customer.phone.replace(/\D/g,''); const waBtn=`<a class="btn sm o" href="https://wa.me/${wa.startsWith('961')||wa.startsWith('1')||wa.startsWith('971')?wa:'961'+wa.replace(/^0/,'')}" target="_blank" rel="noopener" style="text-decoration:none">💬 ${t('whatsapp')}</a>`;
  switch(o.status){ case 'received': return waBtn+(o.customer.verified?'':b('verify','✓ '+t('verify')))+b('accept',t('accept')+' · 20 '+t('min'),'p')+b('cancel',t('cancel'),'d');
    case 'accepted': case 'preparing': return o.type==='intl'?b('out','📦 '+t('handDhl'),'p'):o.type==='pickup'?b('ready',t('ready'),'p'):b('out','🛵 '+t('out'),'p')+b('driver','🔗 '+t('driverLink'))+b('cancel',t('cancel'),'d');

function act(id,a){ const o=D.getOrders().find(x=>x.id===id); const p={}; if(a==='accept'){p.status='accepted';p.prep=20;} if(a==='verify'){p.customer={...o.customer,verified:true};} if(a==='cancel'){p.status='cancelled';p.cancelReason='Cancelled by staff';} if(a==='ready'){p.status='ready';} if(a==='out'){p.status='onTheWay'; if(o.type==='intl') p.tracking='DHL 4471 '+Math.floor(1000+Math.random()*9000)+' '+Math.floor(100+Math.random()*900); else p.driver=o.driver||['Khaled','Mahmoud','Ali'][Math.floor(Math.random()*3)];} if(a==='delivered'){p.status='delivered';} if(a==='driver'){ const link=location.href.replace(/[^/]*$/,'')+'admin.html#d-'+id.toLowerCase(); (navigator.clipboard?.writeText(link)||Promise.reject()).catch(()=>{}); toast(t('driverLink')+' ✓ '+link); return; } D.updateOrder(id,p); toast('#'+id+' → '+L(D.STATUS[p.status]||D.STATUS[o.status])); renderNav(); orders(); }

function customers(){ const os=D.getOrders(); const map={}; D.load('qasr_customers',[]).forEach(c=>{ map[c.phone]={name:c.name,phone:c.phone,email:c.email,verified:c.verified,n:0,spent:0,last:c.joined,branch:'—',source:c.source,points:c.points}; }); os.forEach(o=>{ const k=o.customer.phone; map[k]=map[k]||{name:o.customer.name,phone:k,email:o.customer.email,verified:o.customer.verified,n:0,spent:0,last:0,branch:o.branch,blocked:false,source:o.source||'app'}; if(map[k].branch==='—') map[k].branch=o.branch; map[k].n++; if(o.status!=='cancelled') map[k].spent+=o.total; map[k].last=Math.max(map[k].last,o.ts); map[k].verified=map[k].verified||o.customer.verified; });
  const blocked=D.load('qasr_blocked',[]); const rows=Object.values(map).sort((a,b)=>b.last-a.last);
  $('#work').innerHTML=`<div class="tiles"><div class="card tile"><div class="l">${t('customers')}</div><div class="v">${rows.length}</div></div><div class="card tile"><div class="l">${t('verified')}</div><div class="v">${rows.filter(r=>r.verified).length}</div></div><div class="card tile"><div class="l">${L({en:'Blocked',ar:'محظور'})}</div><div class="v">${blocked.length}</div></div></div><div class="card"><div class="tbl"><table><thead><tr><th>${t('name')}</th><th>${t('phone')}</th><th>${L({en:'Source',ar:'المصدر'})}</th><th>${t('branches')}</th><th>${t('ordersN')}</th><th>${t('spent')}</th><th>${t('points')}</th><th>${t('lastOrder')}</th><th></th></tr></thead><tbody>${rows.map(r=>{ const bl=blocked.includes(r.phone); return `<tr style="${bl?'opacity:.5':''}"><td><b>${r.name}</b> ${r.verified?'<span class="chip ok">✓</span>':'<span class="chip warn">!</span>'}</td><td dir="ltr">${r.phone}${r.email?`<div style="color:var(--muted);font-size:11px">${r.email}</div>`:''}</td><td><span class="chip ${r.source==='google'?'ind':''}">${r.source==='google'?'G Google':r.source==='phone'?'📱 Phone':'📞 Call centre'}</span></td><td>${r.branch==='—'?'—':bname(r.branch)}</td><td>${r.n}</td><td class="money">${fmt(r.spent)}</td><td class="money">${(r.points||0)+Math.round(r.spent*D.settings.cashbackPct/100*D.settings.pointsPerUsd)}</td><td>${new Date(r.last).toLocaleDateString(S.lang==='ar'?'ar-LB':'en-GB',{day:'numeric',month:'short'})}</td><td><button class="btn sm ${bl?'o':'d'}" data-blk="${r.phone}">${bl?t('unblock'):t('block')}</button></td></tr>`; }).join('')}</tbody></table></div></div>`;
  $$('[data-blk]').forEach(b=>b.onclick=()=>{ let bl=D.load('qasr_blocked',[]); const p=b.dataset.blk; bl=bl.includes(p)?bl.filter(x=>x!==p):[...bl,p]; D.save('qasr_blocked',bl); customers(); }); }

// ---------- Reports ----------
function reports(){ const os=D.getOrders().filter(o=>o.status!=='cancelled'); const rev=os.reduce((a,o)=>a+o.total,0); const intlRev=os.filter(o=>o.type==='intl').reduce((a,o)=>a+o.total,0);
  const days=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map((d,i)=>({d,n:[38,41,36,52,67,88,74][i]+(i===6?os.length:0)})); const mx=Math.max(...days.map(x=>x.n));
  const sold={}; os.forEach(o=>o.lines.forEach(l=>{sold[l.id]=(sold[l.id]||0)+l.qty;})); const extra={1327:142,1330:96,1334:41,1337:58,1380:39,1407:33,1342:52,1353:27}; Object.entries(extra).forEach(([k,v])=>sold[k]=(sold[k]||0)+v); const top=Object.entries(sold).sort((a,b)=>b[1]-a[1]).slice(0,8); const tmx=top[0][1];
  const byB={}; os.forEach(o=>byB[o.branch]=(byB[o.branch]||0)+o.total); const bb=[['malla',1840],['mazraa',1210],['aramoun',930],['intl',334]].map(([k,v])=>[k,v+(byB[k]||0)]); const bmx=Math.max(...bb.map(x=>x[1]));
  $('#work').innerHTML=`<div class="tiles"><div class="card tile"><div class="l">${t('revenue')} · 7d</div><div class="v money">${fmt(4314+rev)}</div><div class="d">▲ 12% vs last week</div></div><div class="card tile"><div class="l">${t('ordersN')} · 7d</div><div class="v">${396+os.length}</div><div class="d">▲ 8%</div></div><div class="card tile"><div class="l">${t('avg')}</div><div class="v money">${fmt((4314+rev)/(396+os.length))}</div><div class="d down">▼ 2%</div></div><div class="card tile"><div class="l">${t('intlShare')}</div><div class="v">${Math.round((334+intlRev)/(4314+rev)*100)}%</div><div class="d">▲ 3 pts</div></div></div>
  <div class="grid2"><div class="card" style="padding:16px"><div class="eyebrow">${t('dailyOrders')}</div><div class="bars">${days.map((x,i)=>`<div class="${i>=5?'g':''}" style="height:${x.n/mx*100}%"><span>${x.d}<br>${x.n}</span></div>`).join('')}</div><div style="height:26px"></div></div>
  <div class="card" style="padding:16px"><div class="eyebrow" style="margin-bottom:12px">${t('byBranch')}</div>${bb.map(([k,v])=>`<div class="hbar"><span class="lab">${bname(k)}</span><div class="tr"><i style="width:${v/bmx*100}%"></i></div><span class="v money">${fmt(v)}</span></div>`).join('')}</div>
  <div class="card" style="padding:16px;grid-column:1/-1"><div class="eyebrow" style="margin-bottom:12px">${t('topItems')}</div>${top.map(([id,n])=>`<div class="hbar"><span class="lab">${itemName(+id)}</span><div class="tr"><i style="width:${n/tmx*100}%"></i></div><span class="v">${n}</span></div>`).join('')}</div></div>`; }

// ---------- Settings ----------
function settings(){ const s={...D.settings,...D.load('qasr_settings',{})}; const f=(k,l,step=1)=>`<div class="f"><label>${l}</label><input class="in" type="number" step="${step}" id="s_${k}" value="${s[k]}"></div>`;
  $('#work').innerHTML=`<div class="grid2"><div class="card" style="padding:16px"><div class="eyebrow" style="margin-bottom:10px">${t('points')}</div>${f('pointsPerUsd',t('pointsRate'))}${f('cashbackPct',t('cashback'),0.5)}${f('welcomeBonus',t('welcome'))}</div><div class="card" style="padding:16px"><div class="eyebrow" style="margin-bottom:10px">${L({en:'Money & safety',ar:'المال والأمان'})}</div>${f('lbpRate',t('lbp'),100)}${f('unvLimit',t('unvLimit'))}${f('minBuild',t('minBuild'))}</div><div class="card" style="padding:16px"><div class="eyebrow" style="margin-bottom:10px">${L({en:'Payments',ar:'الدفع'})}</div>${[['cash','💵 '+t('cash'),true],['card','💳 '+t('card')+' (Areeba)',true],['whish','📱 Whish Money',true],['omt','🏧 OMT Pay',false]].map(([k,l,on])=>`<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)"><span style="flex:1;font-weight:700">${l}</span><button class="toggle ${on?'on':''}"></button></div>`).join('')}</div><div class="card" style="padding:16px"><div class="eyebrow" style="margin-bottom:10px">${L({en:'Staff & roles',ar:'الموظفون والأدوار'})}</div>${[['Abed','super_admin','All'],['Bilal','owner','All'],['Rana','call_centre','Malla'],['Samer','branch_manager','Aramoun'],['Khaled','driver','Malla']].map(([n,r,b])=>`<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)"><div class="av" style="width:30px;height:30px;border-radius:9px;background:var(--indigo-soft);color:var(--indigo);display:grid;place-items:center;font-weight:800">${n[0]}</div><div style="flex:1"><b>${n}</b><div style="font-size:11px;color:var(--muted)">${r} · ${b}</div></div><button class="btn sm o">${t('edit')}</button></div>`).join('')}<button class="btn o sm" style="margin-top:10px">+ ${L({en:'Staff login',ar:'حساب موظف'})}</button></div></div><div style="margin-top:14px"><button class="btn p" id="saveS">${t('save')}</button></div>`;
  $('#saveS').onclick=()=>{ const o={}; ['pointsPerUsd','cashbackPct','welcomeBonus','lbpRate','unvLimit','minBuild'].forEach(k=>o[k]=+$('#s_'+k).value); D.save('qasr_settings',o); Object.assign(D.settings,o); toast(t('saved')); }; }

// driver page via hash
function driverPage(){ const m=location.hash.match(/^#d-(q\d+)$/i); if(!m) return false; const o=D.getOrders().find(x=>x.id.toLowerCase()===m[1].toLowerCase()); document.body.innerHTML=`<div style="min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--ivory)"><div class="card" style="padding:24px;width:100%;max-width:380px;text-align:center">${o?`<div class="eyebrow">Driver · ${o.driver||''}</div><h1 class="disp" style="margin:6px 0 2px">#${o.id}</h1><div style="font-weight:700">${o.customer.name} · <span dir="ltr">${o.customer.phone}</span></div><div style="color:var(--muted);margin:6px 0 16px">${o.customer.address}</div><div style="font-size:28px;font-weight:800" class="money">${fmt(o.total)} <span style="font-size:13px;color:var(--muted)">${o.pay}</span></div><div style="display:grid;gap:10px;margin-top:18px">${o.status==='delivered'?`<span class="chip ok" style="justify-content:center;padding:12px">✓ Delivered · link expired</span>`:o.status==='onTheWay'?`<button class="btn ok" style="height:52px" id="dDel">✓ Delivered</button>`:`<button class="btn p" style="height:52px" id="dGot">Got the order</button>`}</div>`:`<h2>Link expired</h2>`}</div></div>`;
  const g=$('#dGot'),d=$('#dDel'); if(g) g.onclick=()=>{D.updateOrder(o.id,{status:'onTheWay'});driverPage();}; if(d) d.onclick=()=>{D.updateOrder(o.id,{status:'delivered'});driverPage();}; return true; }
if(!driverPage()){ applyLang(); render(); } if('serviceWorker' in navigator&&location.protocol==='https:'){ navigator.serviceWorker.register('sw.js').catch(()=>{}); } window.addEventListener('hashchange',()=>{ if(location.hash.startsWith('#d-')) location.reload(); });
})();
</script>
